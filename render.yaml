services:
  - type: web
    name: spendsmart
    runtime: node
    buildCommand: npm run build:render
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # Set manually in Render dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false        # Your Render URL, e.g. https://spendsmart.onrender.com
      - key: SMTP_HOST
        sync: false        # e.g. smtp.gmail.com
      - key: SMTP_PORT
        sync: false        # e.g. 587
      - key: SMTP_USER
        sync: false        # Sending email address
      - key: SMTP_PASS
        sync: false        # App password (not your normal login password)
